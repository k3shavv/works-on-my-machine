# Loaded as /etc/nginx/conf.d/default.conf, so this sits inside nginx's http block.

log_format json escape=json
  '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"rt":$request_time,"upstream":"$upstream_addr","upstream_status":"$upstream_status"}';

server {
    listen 80;
    access_log /dev/stdout json;

    # Docker's built-in DNS. Re-resolving "app" every few seconds is how nginx
    # notices replicas that were added, removed or restarted without a reload.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # internal-only endpoints; Prometheus scrapes the app directly, not via here
    location /admin/ { return 403; }
    location = /metrics { return 403; }

    location / {
        # A variable here makes nginx resolve the name at request time. The name
        # "app" returns one address per replica, and nginx rotates through them.
        set $upstream http://app:8000;
        proxy_pass $upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;

        # If a replica is down or restarting, try another one instead of
        # showing an error. Only safe (idempotent) requests are retried.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        add_header X-Served-By $upstream_addr always;
    }
}
