name: itworks

# Log rotation for every container, so a chatty service can't fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------- core ----
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging

  app:
    build:
      context: ./app
      args:
        APP_VERSION: ${APP_TAG:-local}
    image: ${APP_IMAGE:-itworks-app}:${APP_TAG:-local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      APP_VERSION: ${APP_TAG:-local}
      ENABLE_CHAOS: ${ENABLE_CHAOS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    deploy:
      replicas: ${APP_REPLICAS:-2}
    depends_on:
      db:
        condition: service_healthy
    labels:
      - autoheal=true          # autoheal restarts this container when it turns unhealthy
    stop_grace_period: 25s     # lets gunicorn finish in-flight requests on stop
    networks: [edge, backend]
    # healthcheck comes from the Dockerfile (/healthz every 5s)
    logging: *default-logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data    # data survives container recreation
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  autoheal:
    # Docker marks a container "unhealthy" but never restarts it by itself
    # (outside Swarm). This tiny service does that for containers labelled
    # autoheal=true.
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 5
      AUTOHEAL_START_PERIOD: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *default-logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup.sh", "loop"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    logging: *default-logging

  # ---------------------------------------------- monitoring + logging ----
  # Enabled by COMPOSE_PROFILES=monitoring (set in .env.example).
  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    # edge is needed to publish a port to the host (internal networks can't);
    # backend is how it reaches the app replicas
    networks: [edge, backend]
    logging: *default-logging

  loki:
    image: grafana/loki:3.2.0
    profiles: [monitoring]
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - lokidata:/loki
    networks: [backend]
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.2.0
    profiles: [monitoring]
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./loki/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [backend]
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, loki]
    networks: [edge, backend]
    logging: *default-logging

networks:
  edge: {}                 # the only network the outside world can reach (via nginx)
  backend:
    internal: true         # database, metrics and logs are not reachable from outside

volumes:
  pgdata:
  promdata:
  lokidata:
  grafanadata:
