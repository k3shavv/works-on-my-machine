name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - run: ruff check app
      - run: python -m pytest -q
        working-directory: app

  # Brings up the REAL stack (nginx + app replicas + Postgres) and pokes it.
  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start the stack (core services only)
        run: COMPOSE_PROFILES= docker compose up -d --build --wait --wait-timeout 180
      - name: Check it end to end
        run: |
          curl -fsS http://127.0.0.1:8080/readyz
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"text":"from ci"}' http://127.0.0.1:8080/notes
          curl -fsS http://127.0.0.1:8080/notes | grep "from ci"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/admin/crash -X POST)" = "403"
      - name: Logs on failure
        if: failure()
        run: COMPOSE_PROFILES=monitoring docker compose logs --tail=100
      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name must be lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-app" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Only runs once you set the repository variable DEPLOY_HOST (and the secrets
  # DEPLOY_USER / DEPLOY_SSH_KEY). Without them the pipeline stops after publish.
  deploy:
    needs: publish
    if: ${{ vars.DEPLOY_HOST != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/itworks
            git pull --ff-only
            ./scripts/deploy.sh ${{ github.sha }}
